<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library · jb-pdf-viewer</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/library.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10a3 3 0 0 1 2 5.2V21a3 3 0 0 0-2-.8H5.5A2.5 2.5 0 0 1 3 17.7z"/>
      <path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H14a3 3 0 0 0-2 5.2V21a3 3 0 0 1 2-.8h4.5a2.5 2.5 0 0 0 2.5-2.5z"/>
    </svg>
    <span>Library<span class="sub"> · all shelves</span></span>
  </a>

  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search every page of every document…"
           aria-label="Search the collection">
    <kbd>/</kbd>
  </div>

  <span class="spacer"></span>

  <label class="size-ctl" title="Cover size">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <input id="tile-size" type="range" min="110" max="260" step="10" value="150"
           aria-label="Cover size">
  </label>
  <span id="stats" class="pill" title="Collection totals"></span>
  <button class="btn" id="manage" hidden title="Add or edit libraries">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      <path d="M12 11v5M9.5 13.5h5"/></svg>
    Libraries
  </button>
</header>

<main class="wrap">
  <h1 class="page-title">Your collection</h1>
  <p class="page-sub" id="subtitle">Loading…</p>

  <section class="resume" id="resume" hidden>
    <div class="section-head"><h2>Continue reading</h2></div>
    <div class="resume-strip" id="resume-strip"></div>
  </section>

  <nav class="libs" id="libs"></nav>
  <div class="group-pick" id="group-pick" hidden>
    <label for="group-select" style="color:var(--fg-3);font-size:12.5px">Folder</label>
    <select id="group-select"></select>
  </div>
  <nav class="series-nav" id="series-nav"></nav>
  <div id="shelves"></div>
</main>

<script type="module" src="/static/js/library.js"></script>
</body>
</html>
