<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · jb-pdf-viewer</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/library.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10a3 3 0 0 1 2 5.2V21a3 3 0 0 0-2-.8H5.5A2.5 2.5 0 0 1 3 17.7z"/>
      <path d="M21 5.5A2.5 2.5 0 0 0 18.5 3H14a3 3 0 0 0-2 5.2V21a3 3 0 0 1 2-.8h4.5a2.5 2.5 0 0 0 2.5-2.5z"/>
    </svg>
    <span>Library<span class="sub"> · search</span></span>
  </a>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search every page of every document…" aria-label="Search the collection">
    <kbd>/</kbd>
  </div>
  <span class="spacer"></span>
</header>

<main class="wrap">
  <h1 class="page-title" id="heading">Search</h1>
  <p class="result-meta" id="meta">
    Type a phrase to search the full text of every document.
    Use <code>"quotes"</code> for an exact phrase.
  </p>
  <nav class="filters" id="filters"></nav>
  <div class="results" id="results"></div>
</main>

<script type="module" src="/static/js/search.js"></script>
</body>
</html>
